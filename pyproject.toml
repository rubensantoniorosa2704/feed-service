[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feed-service"
version = "0.1.0"
description = "Atom feed generator for TikTok profiles (and future sources)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "feed-service contributors"}
]
keywords = ["tiktok", "atom", "rss", "feed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # Raspagem do TikTok. É a razão de este serviço ser Python.
    "yt-dlp==2026.8.19",
    
    # HTTP
    "flask==3.1.0",
    
    # Servidor WSGI. O servidor embutido do Flask não é feito para rodar 24/7.
    "waitress==3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
feed-service = "feed_service.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line too long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=feed_service --cov-report=term-missing"
