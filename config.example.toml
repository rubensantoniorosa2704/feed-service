[server]
# 127.0.0.1: só a máquina local alcança o serviço (sem auth, mantenha assim).
# 0.0.0.0: obrigatório dentro do Docker; ponha proxy/auth na frente antes.
host = "127.0.0.1"
port = 8080

[storage]
db_path = "./data/feed-service.db"

[defaults]
interval_minutes = 15
jitter_seconds = 90
fetch_limit = 5
feed_max_entries = 20
# Teto do backoff exponencial em falhas consecutivas. A cada falha o intervalo
# dobra em cima do base; capa aqui pra não bater na fonte por horas se algo
# quebrar de madrugada. Reseta em qualquer raspagem bem-sucedida.
max_backoff_minutes = 240

# Um bloco por perfil.
# `name` é o slug do feed: /feed/<name>.xml.
# `username` é o handle público do TikTok (o @ da URL, sem o @).
# Ex: https://www.tiktok.com/@fulano -> username = "fulano"
[[profiles]]
name = "example_user"
username = "fulano"
# interval_minutes = 60  # opcional, sobrepõe o default para este perfil
